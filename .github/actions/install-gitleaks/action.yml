name: Install pinned Gitleaks
description: Verify the official scanner archive before execution
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        if ! curl --fail --location --silent --show-error --retry 3 --retry-delay 2 --retry-max-time 60 --connect-timeout 10 --max-time 30 \
          --proto '=https' --proto-redir '=https' --output "$RUNNER_TEMP/gitleaks.tar.gz" \
          https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz; then
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 --retry-max-time 60 --connect-timeout 10 --max-time 30 \
            --proto '=https' --proto-redir '=https' --header 'Accept: application/octet-stream' \
            --output "$RUNNER_TEMP/gitleaks.tar.gz" https://api.github.com/repos/gitleaks/gitleaks/releases/assets/378332058
        fi
        echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
        mkdir -p "$RUNNER_TEMP/ala-tools"
        tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/ala-tools" gitleaks
        echo "$RUNNER_TEMP/ala-tools" >> "$GITHUB_PATH"
