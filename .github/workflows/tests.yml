name: ala linux chrome smoke
# 공개 이력 · 테스트 · 후보 묶음은 회사 Mac Studio가 돌린다(.studio/ci.sh, ubion-dev/tool-hooks). 여기는 스튜디오가 못 하는 실제 Linux Chrome smoke만
# (공식 Chrome이 amd64뿐이고 sudo unshare --net이 필요).

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install locked development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Real Linux Chrome proc smoke; sandbox enabled and network isolated
        timeout-minutes: 2
        run: |
          ALA_SMOKE_USER="$(id -un)"
          ALA_SMOKE_PYTHON="$(command -v python)"
          sudo unshare --net -- sh -ec 'ip link set lo up; exec "$@"' ala-linux-smoke runuser -u "$ALA_SMOKE_USER" -- env \
            PATH="$PATH" ALA_LINUX_CHROME_SMOKE=1 \
            "$ALA_SMOKE_PYTHON" -m pytest tests/test_linux_chrome_smoke.py -q -s --tb=short --show-capture=no
