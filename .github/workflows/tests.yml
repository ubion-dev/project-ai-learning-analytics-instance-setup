name: ala tests and candidate bundle

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: ./.github/actions/install-gitleaks
      - name: Inspect complete public history without printing rejected values
        run: python scripts/check-public.py --history
  tests:
    needs: public-data
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: ./.github/actions/install-gitleaks
      - name: Install locked development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Bash syntax
        run: |
          bash -n install.sh
          find scripts/rocky-linux -name '*.sh' -exec bash -n {} \;
      - name: Regression and isolated CLI/TUI/installer tests
        run: python -m pytest -q --tb=no --show-capture=no
      - name: Build hashed offline-installable candidate
        run: |
          python scripts/build-release.py
          python -c 'import tomllib; print("ALA_VERSION=" + tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])' >> "$GITHUB_ENV"
      - name: Candidate entrypoint smoke test
        run: |
          mkdir -p build/smoke
          tar -xzf "dist/ala-${ALA_VERSION}.tar.gz" -C build/smoke
          python -I "build/smoke/ala-${ALA_VERSION}/entry.py" --version
          python -I "build/smoke/ala-${ALA_VERSION}/entry.py" --help
      - name: Upload candidate; physical Rocky acceptance remains separate
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ala-${{ env.ALA_VERSION }}-candidate
          path: dist/ala-*.tar.gz*
          if-no-files-found: error
          retention-days: 14
